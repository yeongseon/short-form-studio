[project]
name = "short-form-studio"
version = "0.1.0"
description = "Scaffolded monorepo for short-form pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Yeongseon Choe"}]
urls = {Homepage = "https://github.com/yeongseon/short-form-studio", Repository = "https://github.com/yeongseon/short-form-studio"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
]

[tool.uv.workspace]
members = [
  "apps/api",
  "apps/worker-orchestrator",
  "packages/creator-domain",
  "packages/creator-service",
  "packages/creator-provider",
]

[tool.basedpyright]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUnknownMemberType = false
extraPaths = [
  "packages/creator-domain",
  "packages/creator-service",
  "packages/creator-provider",
  "apps/api/src",
  "apps/worker-orchestrator",
]
