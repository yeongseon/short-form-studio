[project]
name = "short-form-studio"
version = "0.4.0"
description = "AI-powered short-form video production pipeline with human-in-the-loop review"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Yeongseon Choe"}]
urls = {Homepage = "https://github.com/yeongseon/short-form-studio", Repository = "https://github.com/yeongseon/short-form-studio"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
]

[tool.uv.workspace]
members = [
  "packages/creator-domain",
  "packages/creator-service",
  "packages/creator-provider",
]

# apps/api and apps/worker-orchestrator use requirements.txt (no pyproject.toml).
# They are intentionally excluded from the uv workspace.

[tool.basedpyright]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUnknownMemberType = false
extraPaths = [
  "packages/creator-domain",
  "packages/creator-service",
  "packages/creator-provider",
  "apps/api/src",
  "apps/worker-orchestrator",
]
