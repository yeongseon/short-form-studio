name: Security Scan

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  trivy-container-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
          - service: studio-web
            dockerfile: apps/studio-web/Dockerfile
          - service: worker
            dockerfile: apps/worker-orchestrator/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build runtime image for scan
        run: docker build --target runtime -f ${{ matrix.dockerfile }} -t local/${{ matrix.service }}:scan .

      - name: Trivy scan (${{ matrix.service }})
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: local/${{ matrix.service }}:scan
          severity: CRITICAL,HIGH
          exit-code: '1'

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Python dependency scan (API)
        run: pip-audit -r apps/api/requirements.txt

      - name: Python dependency scan (Worker)
        run: pip-audit -r apps/worker-orchestrator/requirements.txt

      - name: Install frontend dependencies
        run: npm --prefix apps/studio-web ci

      - name: Node dependency scan (Studio Web)
        run: npm --prefix apps/studio-web audit --audit-level=high
