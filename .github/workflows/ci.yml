name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python3 -m pip install -r apps/api/requirements.txt -r apps/api/requirements-dev.txt -r apps/worker-orchestrator/requirements.txt -r apps/worker-orchestrator/requirements-dev.txt
      - name: Install packages in editable mode
        run: |
          pip install -e packages/creator-domain
          pip install -e packages/creator-provider
          pip install -e packages/creator-service
      - name: Install Node dependencies
        run: npm --prefix apps/studio-web ci
      - name: Lint Python
        run: |
          ruff check apps packages
          python3 -m compileall apps packages
      - name: Lint TypeScript
        run: npm --prefix apps/studio-web run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python3 -m pip install -r apps/api/requirements.txt -r apps/api/requirements-dev.txt -r apps/worker-orchestrator/requirements.txt -r apps/worker-orchestrator/requirements-dev.txt
      - name: Install packages in editable mode
        run: |
          pip install -e packages/creator-domain
          pip install -e packages/creator-provider
          pip install -e packages/creator-service
      - name: Install Node dependencies
        run: npm --prefix apps/studio-web ci
      - name: Test Packages (with coverage)
        run: |
          python3 -m pytest packages/creator-domain/tests/ -v --cov=creator_domain --cov-report=term-missing
          python3 -m pytest packages/creator-provider/tests/ -v --cov=creator_provider --cov-report=term-missing
          python3 -m pytest packages/creator-service/tests/ -v --cov=creator_service --cov-report=term-missing
      - name: Test API (with coverage)
        run: cd apps/api && python3 -m pytest tests/ -v --cov=shorts_api --cov-report=term-missing --cov-fail-under=60
      - name: Test Worker (with coverage)
        run: cd apps/worker-orchestrator && python3 -m pytest tests/ -v --cov=tasks --cov-report=term-missing --cov-fail-under=40
      - name: Test Frontend (with coverage)
        run: npm --prefix apps/studio-web run test -- --coverage --coverage.thresholds.lines=60
      - name: Build Frontend
        run: npm --prefix apps/studio-web run build
      - name: Typecheck Frontend
        run: npx --prefix apps/studio-web tsc --noEmit

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose config
        run: docker compose config --quiet
      - name: Build API runtime image
        run: docker build --target runtime -f apps/api/Dockerfile .
      - name: Build Studio Web runtime image
        run: docker build --target runtime -f apps/studio-web/Dockerfile .
