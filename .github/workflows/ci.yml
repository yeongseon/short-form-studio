name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python3 -m pip install -c constraints.txt -r apps/api/requirements.txt -r apps/api/requirements-dev.txt -r apps/worker-orchestrator/requirements.txt -r apps/worker-orchestrator/requirements-dev.txt
      - name: Install packages in editable mode
        run: |
          pip install -c constraints.txt -e packages/creator-domain
          pip install -c constraints.txt -e packages/creator-provider
          pip install -c constraints.txt -e packages/creator-service
      - name: Install Node dependencies
        run: npm --prefix apps/studio-web ci
      - name: Lint Python
        run: |
          ruff check apps packages
          python3 -m compileall apps packages
      - name: Lint TypeScript
        run: npm --prefix apps/studio-web run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python3 -m pip install -c constraints.txt -r apps/api/requirements.txt -r apps/api/requirements-dev.txt -r apps/worker-orchestrator/requirements.txt -r apps/worker-orchestrator/requirements-dev.txt
      - name: Install packages in editable mode
        run: |
          pip install -c constraints.txt -e packages/creator-domain
          pip install -c constraints.txt -e packages/creator-provider
          pip install -c constraints.txt -e packages/creator-service
      - name: Validate Alembic migrations
        run: |
          cd apps/api
          export DATABASE_URL="postgresql://user:pass@localhost:5432/db"
          # Verify single migration head (no branches)
          HEAD_COUNT=$(alembic heads 2>&1 | grep -E '^[0-9a-f]+' | wc -l)
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "ERROR: Multiple migration heads detected ($HEAD_COUNT heads)"
            alembic heads
            exit 1
          fi
          echo "Migration validation complete (1 head)"
      - name: Install Node dependencies
        run: npm --prefix apps/studio-web ci
      - name: Test Packages (with coverage)
        run: |
          python3 -m pytest packages/creator-domain/tests/ -v --cov=creator_domain --cov-report=term-missing --cov-fail-under=60
          python3 -m pytest packages/creator-provider/tests/ -v --cov=creator_provider --cov-report=term-missing --cov-fail-under=60
          python3 -m pytest packages/creator-service/tests/ -v --cov=creator_service --cov-report=term-missing --cov-fail-under=60
      - name: Test API (with coverage)
        run: cd apps/api && python3 -m pytest tests/ -v --cov=shorts_api --cov-report=term-missing --cov-fail-under=75
      - name: Test Worker (with coverage)
        run: cd apps/worker-orchestrator && python3 -m pytest tests/ -v --cov=tasks --cov-report=term-missing --cov-fail-under=60
      - name: Test Frontend (with coverage)
        run: npm --prefix apps/studio-web run test -- --coverage --coverage.thresholds.lines=75
      - name: Build Frontend
        run: npm --prefix apps/studio-web run build
      - name: Typecheck Frontend
        run: cd apps/studio-web && npx tsc --noEmit
      - name: Typecheck Python (basedpyright)
        run: |
          pip install basedpyright==1.29.2
          basedpyright apps packages

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from example
        run: cp .env.example .env
      - name: Validate docker-compose config
        run: docker compose config --quiet
      - name: Verify celery beat service is defined
        run: |
          # Every beat_schedule entry needs a running beat process (#585).
          docker compose config --services | grep -q '^beat$' \
            || { echo 'ERROR: no beat service defined — scheduled tasks will never run'; exit 1; }
      - name: Verify API port not exposed on 0.0.0.0
        run: |
          # Ensure API, Postgres, and Redis are bound to 127.0.0.1 only
          if docker compose config | grep -E 'published:.*8000' | grep -v '127.0.0.1'; then
            echo "ERROR: API port 8000 must be bound to 127.0.0.1, not 0.0.0.0"
            exit 1
          fi
          if docker compose config | grep -E 'published:.*5432' | grep -v '127.0.0.1'; then
            echo "ERROR: Postgres port 5432 must be bound to 127.0.0.1"
            exit 1
          fi
          if docker compose config | grep -E 'published:.*6379' | grep -v '127.0.0.1'; then
            echo "ERROR: Redis port 6379 must be bound to 127.0.0.1"
            exit 1
          fi
          echo "Port exposure check passed: all backend services on 127.0.0.1"
      - name: Build API runtime image
        run: docker build --target runtime -f apps/api/Dockerfile .
      - name: Build Studio Web runtime image
        run: docker build --target runtime -f apps/studio-web/Dockerfile .
      - name: Build Worker runtime image
        run: docker build --target runtime -f apps/worker-orchestrator/Dockerfile .
      - name: Smoke-test compose up
        run: |
          docker compose up -d postgres redis api studio-web worker beat
          # Wait for API health endpoint
          timeout 60 bash -c 'until curl -sf http://localhost:8000/healthz; do sleep 2; done'
          # Verify API responds
          curl -sf http://localhost:8000/healthz
          # Wait for frontend endpoint
          timeout 60 bash -c 'until curl -sf http://localhost:5174/; do sleep 2; done'
          # Verify frontend responds
          curl -sf http://localhost:5174/
          # Verify worker container is running
          docker compose ps worker --format json | grep -q running
          # Verify every beat_schedule task is registered on the worker (#585).
          # Catches both missing include entries and NotRegistered at dispatch time.
          for task in reconcile_stale_dispatches retry_failed_artifact_deletions; do
            docker compose exec -T worker celery -A celery_app.celery_app inspect registered \
              | grep -q "$task" \
              || { echo "ERROR: beat task '$task' not registered on worker"; exit 1; }
            echo "OK: $task registered"
          done
          # --- Creator API smoke test ---
          # Run migrations
          docker compose exec -T api alembic upgrade head
          # Bootstrap dev auth
          docker compose exec -T api python scripts/create_api_key.py \
            --email ci@example.com --workspace ci --name ci-key > /tmp/api_key_output.txt
          API_KEY=$(grep -oP '  \K[A-Za-z0-9_-]+$' /tmp/api_key_output.txt)
          # Verify auth: no key = 401
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/creator/users/me)
          [ "$HTTP_CODE" = "401" ] || (echo "Expected 401 without key, got $HTTP_CODE" && exit 1)
          # Verify auth: valid key = 200
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "X-API-Key: $API_KEY" http://localhost:8000/api/creator/users/me)
          [ "$HTTP_CODE" = "200" ] || (echo "Expected 200 with valid key, got $HTTP_CODE" && exit 1)
          # Create project
          PROJECT_RESPONSE=$(curl -sf -H "X-API-Key: $API_KEY" -H "Content-Type: application/json" \
            -d '{"title":"Smoke Test","source_type":"idea","idea_brief":"test short video"}' \
            http://localhost:8000/api/creator/projects)
          PROJECT_ID=$(echo "$PROJECT_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Created project: $PROJECT_ID"
          # Create run
          curl -sf -H "X-API-Key: $API_KEY" -H "Content-Type: application/json" \
            -d '{"style_preset":"default"}' \
            http://localhost:8000/api/creator/projects/$PROJECT_ID/runs
          echo "Creator API smoke test passed"
          # --- nginx CSRF smoke test (#586) ---
          # POST through nginx (port 5174) with the real browser Origin header.
          # Before the fix, $host didn't include the port, so the CSRF check
          # rejected every write with 403.
          NGINX_POST_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Origin: http://127.0.0.1:5174" \
            -H "X-API-Key: $API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"title":"Nginx CSRF Smoke","source_type":"idea","idea_brief":"nginx"}' \
            http://localhost:5174/api/creator/projects)
          [ "$NGINX_POST_CODE" = "200" ] || [ "$NGINX_POST_CODE" = "201" ] \
            || { echo "Expected 2xx for nginx-proxied POST with valid Origin, got $NGINX_POST_CODE"; exit 1; }
          echo "nginx CSRF smoke passed ($NGINX_POST_CODE)"
          docker compose down
