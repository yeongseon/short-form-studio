name: Build & Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_image_tag:
        description: "Image tag to rollback to"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SERVICE_NAME: api
  IMAGE_REPOSITORY: ${{ github.repository }}

jobs:
  build-scan-push:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
          - service: studio-web
            dockerfile: apps/studio-web/Dockerfile
          - service: worker
            dockerfile: apps/worker-orchestrator/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: vars
        run: |
          echo "sha_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build image (local only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runtime
          push: false
          load: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ steps.vars.outputs.sha_tag }}

      - name: Trivy scan (${{ matrix.service }})
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ steps.vars.outputs.sha_tag }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Push image (after scan passes)
        if: success() && github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ steps.vars.outputs.sha_tag }}

  deploy-staging:
    needs: [build-scan-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, studio-web]
    env:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
      IMAGE_TAG: ${{ github.sha }}
      API_HEALTHCHECK_URL: ${{ vars.STAGING_API_URL }}
      WEB_HEALTHCHECK_URL: ${{ vars.STAGING_WEB_URL }}
      WORKER_REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to staging (${{ matrix.service }})
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_REPOSITORY}/${{ matrix.service }}:${IMAGE_TAG}"
          if [ -z "${DEPLOY_WEBHOOK_URL:-}" ]; then
            echo "DEPLOY_WEBHOOK_URL is not configured for production environment"
            exit 1
          fi
          curl -fsSL -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"image\":\"${IMAGE}\",\"service\":\"${{ matrix.service }}\",\"source\":\"cd-workflow\"}"

      - name: Verify deployment health
        run: |
          echo "Starting health check verification..."
          if [ "${{ matrix.service }}" = "api" ]; then
            if [ -z "${API_HEALTHCHECK_URL:-}" ]; then
              echo "ERROR: HEALTHCHECK_URL not set"
              exit 1
            fi

            for i in 1 2 3 4 5; do
              echo "API health check attempt $i/5..."
              if curl -sf "${API_HEALTHCHECK_URL}/healthz" -o /dev/null 2>/dev/null; then
                echo "API health check passed"
                exit 0
              fi
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            done
            echo "API health check failed after 5 attempts"
            exit 1
          fi

          if [ "${{ matrix.service }}" = "studio-web" ]; then
            if [ -z "${WEB_HEALTHCHECK_URL:-}" ]; then
              echo "ERROR: HEALTHCHECK_URL not set"
              exit 1
            fi

            for i in 1 2 3 4 5; do
              echo "Web health check attempt $i/5..."
              if curl -sf "${WEB_HEALTHCHECK_URL}/" -o /dev/null 2>/dev/null; then
                echo "Web health check passed"
                exit 0
              fi
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            done
            echo "Web health check failed after 5 attempts"
            exit 1
          fi

          if [ "${{ matrix.service }}" = "worker" ]; then
            if [ -z "${WORKER_REDIS_URL:-}" ]; then
              echo "ERROR: WORKER_REDIS_URL not set"
              exit 1
            fi

            for i in 1 2 3 4 5; do
              echo "Worker health check attempt $i/5..."
              if docker run --rm \
                -e REDIS_URL="${WORKER_REDIS_URL}" \
                "${REGISTRY}/${IMAGE_REPOSITORY}/worker:${IMAGE_TAG}" \
                python healthcheck.py; then
                echo "Worker health check passed"
                exit 0
              fi
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            done
            echo "Worker health check failed after 5 attempts"
            exit 1
          fi

  deploy-production:
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, studio-web]
    env:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
      IMAGE_TAG: ${{ github.sha }}
      API_HEALTHCHECK_URL: ${{ vars.PRODUCTION_API_URL }}
      WEB_HEALTHCHECK_URL: ${{ vars.PRODUCTION_WEB_URL }}
      WORKER_REDIS_URL: ${{ secrets.PRODUCTION_REDIS_URL }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to production (${{ matrix.service }})
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_REPOSITORY}/${{ matrix.service }}:${IMAGE_TAG}"
          if [ -z "${DEPLOY_WEBHOOK_URL:-}" ]; then
            echo "DEPLOY_WEBHOOK_URL is not configured for production environment"
            exit 1
          fi
          curl -fsSL -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"image\":\"${IMAGE}\",\"service\":\"${{ matrix.service }}\",\"source\":\"cd-workflow\"}"

      - name: Verify deployment health
        run: |
          echo "Starting health check verification..."
          if [ "${{ matrix.service }}" = "api" ]; then
            if [ -z "${API_HEALTHCHECK_URL:-}" ]; then
              echo "ERROR: HEALTHCHECK_URL not set"
              exit 1
            fi

            for i in 1 2 3 4 5; do
              echo "API health check attempt $i/5..."
              if curl -sf "${API_HEALTHCHECK_URL}/healthz" -o /dev/null 2>/dev/null; then
                echo "API health check passed"
                exit 0
              fi
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            done
            echo "API health check failed after 5 attempts"
            exit 1
          fi

          if [ "${{ matrix.service }}" = "studio-web" ]; then
            if [ -z "${WEB_HEALTHCHECK_URL:-}" ]; then
              echo "ERROR: HEALTHCHECK_URL not set"
              exit 1
            fi

            for i in 1 2 3 4 5; do
              echo "Web health check attempt $i/5..."
              if curl -sf "${WEB_HEALTHCHECK_URL}/" -o /dev/null 2>/dev/null; then
                echo "Web health check passed"
                exit 0
              fi
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            done
            echo "Web health check failed after 5 attempts"
            exit 1
          fi

          if [ "${{ matrix.service }}" = "worker" ]; then
            if [ -z "${WORKER_REDIS_URL:-}" ]; then
              echo "ERROR: WORKER_REDIS_URL not set"
              exit 1
            fi

            for i in 1 2 3 4 5; do
              echo "Worker health check attempt $i/5..."
              if docker run --rm \
                -e REDIS_URL="${WORKER_REDIS_URL}" \
                "${REGISTRY}/${IMAGE_REPOSITORY}/worker:${IMAGE_TAG}" \
                python healthcheck.py; then
                echo "Worker health check passed"
                exit 0
              fi
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            done
            echo "Worker health check failed after 5 attempts"
            exit 1
          fi

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_image_tag != ''
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, studio-web]
    env:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
      ROLLBACK_IMAGE_TAG: ${{ inputs.rollback_image_tag }}
      API_HEALTHCHECK_URL: ${{ vars.PRODUCTION_API_URL }}
      WORKER_REDIS_URL: ${{ secrets.PRODUCTION_REDIS_URL }}
      STUDIO_HEALTHCHECK_URL: ${{ vars.PRODUCTION_WEB_URL }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger rollback deploy (${{ matrix.service }})
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_REPOSITORY}/${{ matrix.service }}:${ROLLBACK_IMAGE_TAG}"
          if [ -z "${DEPLOY_WEBHOOK_URL:-}" ]; then
            echo "DEPLOY_WEBHOOK_URL is not configured for production environment"
            exit 1
          fi
          curl -fsSL -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"image\":\"${IMAGE}\",\"service\":\"${{ matrix.service }}\",\"source\":\"rollback\"}"

      - name: Verify deployment health
        run: |
          echo "Starting health check verification for ${{ matrix.service }}..."

          if [ "${{ matrix.service }}" = "api" ]; then
            if [ -z "${API_HEALTHCHECK_URL:-}" ]; then
              echo "ERROR: API_HEALTHCHECK_URL not set"
              exit 1
            fi

            for i in 1 2 3 4 5; do
              echo "API health check attempt $i/5..."
              if curl -sf "${API_HEALTHCHECK_URL}/healthz" -o /dev/null 2>/dev/null; then
                echo "API health check passed"
                exit 0
              fi
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            done

            echo "API health check failed after 5 attempts"
            exit 1
          fi

          if [ "${{ matrix.service }}" = "worker" ]; then
            if [ -z "${WORKER_REDIS_URL:-}" ]; then
              echo "ERROR: WORKER_REDIS_URL not set"
              exit 1
            fi

            for i in 1 2 3 4 5; do
              echo "Worker health check attempt $i/5..."
              if docker run --rm \
                -e REDIS_URL="${WORKER_REDIS_URL}" \
                "${REGISTRY}/${IMAGE_REPOSITORY}/worker:${ROLLBACK_IMAGE_TAG}" \
                python healthcheck.py; then
                echo "Worker health check passed"
                exit 0
              fi
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            done

            echo "Worker health check failed after 5 attempts"
            exit 1
          fi

          if [ "${{ matrix.service }}" = "studio-web" ]; then
            if [ -z "${STUDIO_HEALTHCHECK_URL:-}" ]; then
              echo "ERROR: STUDIO_HEALTHCHECK_URL not set"
              exit 1
            fi

            for i in 1 2 3 4 5; do
              echo "Studio-web health check attempt $i/5..."
              if curl -sf "${STUDIO_HEALTHCHECK_URL}/" -o /dev/null 2>/dev/null; then
                echo "Studio-web health check passed"
                exit 0
              fi
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            done

            echo "Studio-web health check failed after 5 attempts"
            exit 1
          fi

          echo "ERROR: Unknown service '${{ matrix.service }}'"
          exit 1
