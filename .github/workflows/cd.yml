name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_action:
        description: "Deploy a release, roll back applications only, or separately downgrade the database"
        required: true
        default: rollback
        type: choice
        options: [deploy, rollback, db_downgrade]
      release_run_id:
        description: "Successful CD run ID containing the promoted release manifest artifact"
        required: true
        type: number
      approve_db_downgrade:
        description: "Leave empty for app-only rollback; enter DOWNGRADE for the separate production DB downgrade"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/api
  WORKER_IMAGE: ghcr.io/${{ github.repository }}/worker
  STUDIO_IMAGE: ghcr.io/${{ github.repository }}/studio-web

jobs:
  wait-for-ci:
    if: ${{ vars.DEPLOYMENT_ENABLED == 'true' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI lint
        uses: lewagon/wait-on-check-action@v1.3.4
        with: {ref: "${{ github.sha }}", check-name: lint, repo-token: "${{ secrets.GITHUB_TOKEN }}", wait-interval: 10}
      - name: Wait for CI test
        uses: lewagon/wait-on-check-action@v1.3.4
        with: {ref: "${{ github.sha }}", check-name: test, repo-token: "${{ secrets.GITHUB_TOKEN }}", wait-interval: 10}
      - name: Wait for CI docker
        uses: lewagon/wait-on-check-action@v1.3.4
        with: {ref: "${{ github.sha }}", check-name: docker, repo-token: "${{ secrets.GITHUB_TOKEN }}", wait-interval: 10}
      - name: Wait for CI first-Short runtime
        uses: lewagon/wait-on-check-action@v1.3.4
        with: {ref: "${{ github.sha }}", check-name: first-short-runtime, repo-token: "${{ secrets.GITHUB_TOKEN }}", wait-interval: 10}

  build-candidate:
    if: ${{ vars.DEPLOYMENT_ENABLED == 'true' && github.event_name == 'push' }}
    needs: wait-for-ci
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tags.outputs.release_tag }}
      candidate_tag: ${{ steps.tags.outputs.candidate_tag }}
      api_digest: ${{ steps.api.outputs.digest }}
      worker_digest: ${{ steps.worker.outputs.digest }}
      studio_digest: ${{ steps.studio.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Compute candidate identity
        id: tags
        env: {SHA: "${{ github.sha }}", RUN_NUMBER: "${{ github.run_number }}"}
        run: |
          set -euo pipefail
          echo "release_tag=$(date -u +%Y.%m.%d).${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=candidate-${SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and push API candidate
        id: api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: true
          tags: ${{ env.API_IMAGE }}:${{ steps.tags.outputs.candidate_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: SOURCE_SHA=${{ github.sha }}
      - name: Build and push worker candidate
        id: worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker-orchestrator/Dockerfile
          target: runtime
          push: true
          tags: ${{ env.WORKER_IMAGE }}:${{ steps.tags.outputs.candidate_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: SOURCE_SHA=${{ github.sha }}
      - name: Build and push Studio candidate
        id: studio
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/studio-web/Dockerfile
          target: runtime
          push: true
          tags: ${{ env.STUDIO_IMAGE }}:${{ steps.tags.outputs.candidate_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: SOURCE_SHA=${{ github.sha }}

  trivy-scan:
    if: ${{ vars.DEPLOYMENT_ENABLED == 'true' && github.event_name == 'push' }}
    needs: build-candidate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ghcr.io/${{ github.repository }}/api@${{ needs.build-candidate.outputs.api_digest }}
          - ghcr.io/${{ github.repository }}/worker@${{ needs.build-candidate.outputs.worker_digest }}
          - ghcr.io/${{ github.repository }}/studio-web@${{ needs.build-candidate.outputs.studio_digest }}
    steps:
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  create-manifest:
    if: ${{ vars.DEPLOYMENT_ENABLED == 'true' && github.event_name == 'push' }}
    needs: [build-candidate, trivy-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Install pinned release validator dependency
        run: python -m pip install --disable-pip-version-check pydantic==2.12.3
      - name: Bind release identities and contracts
        env:
          RELEASE_TAG: ${{ needs.build-candidate.outputs.release_tag }}
          SOURCE_SHA: ${{ github.sha }}
          API_DIGEST: ${{ needs.build-candidate.outputs.api_digest }}
          WORKER_DIGEST: ${{ needs.build-candidate.outputs.worker_digest }}
          STUDIO_DIGEST: ${{ needs.build-candidate.outputs.studio_digest }}
          SCHEMA_CONTRACT: ${{ vars.SCHEMA_CONTRACT_VERSION }}
          QUEUE_CONTRACT: ${{ vars.QUEUE_CONTRACT_VERSION }}
        run: |
          set -euo pipefail
          db_revision="$(docker run --rm "${API_IMAGE}@${API_DIGEST}" alembic heads | awk '{print $1}')"
          jq -n --arg tag "$RELEASE_TAG" --arg sha "$SOURCE_SHA" \
            --arg api "$API_DIGEST" --arg worker "$WORKER_DIGEST" --arg studio "$STUDIO_DIGEST" \
            --arg db "$db_revision" --arg schema "$SCHEMA_CONTRACT" --arg queue "$QUEUE_CONTRACT" \
            '{release_tag:$tag,source_sha:$sha,images:{api:{repository:env.API_IMAGE,digest:$api},worker:{repository:env.WORKER_IMAGE,digest:$worker},studio:{repository:env.STUDIO_IMAGE,digest:$studio}},db_revision:$db,schema_contract:$schema,queue_contract:$queue}' > release.json
          python scripts/release_manifest.py validate release.json "$RELEASE_TAG" "$SCHEMA_CONTRACT" "$QUEUE_CONTRACT" "${{ github.repository }}" \
            "${{ vars.STAGING_API_URL }}" "${{ vars.STAGING_STUDIO_URL }}" "${{ vars.PRODUCTION_API_URL }}" "${{ vars.PRODUCTION_STUDIO_URL }}"
      - uses: actions/upload-artifact@v4
        with: {name: "release-manifest-${{ needs.build-candidate.outputs.release_tag }}", path: release.json, retention-days: 90}

  promote-release:
    if: ${{ vars.DEPLOYMENT_ENABLED == 'true' && github.event_name == 'push' && needs.trivy-scan.result == 'success' }}
    needs: [build-candidate, trivy-scan, create-manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: imjasonh/setup-crane@v0.4
      - name: Promote scanned digests to approved release and latest tags
        env:
          RELEASE_TAG: ${{ needs.build-candidate.outputs.release_tag }}
          API_DIGEST: ${{ needs.build-candidate.outputs.api_digest }}
          WORKER_DIGEST: ${{ needs.build-candidate.outputs.worker_digest }}
          STUDIO_DIGEST: ${{ needs.build-candidate.outputs.studio_digest }}
        run: |
          set -euo pipefail
          for target in "$API_IMAGE@$API_DIGEST" "$WORKER_IMAGE@$WORKER_DIGEST" "$STUDIO_IMAGE@$STUDIO_DIGEST"; do
            crane tag "$target" "$RELEASE_TAG"
          done
          for target in "$API_IMAGE@$API_DIGEST" "$WORKER_IMAGE@$WORKER_DIGEST" "$STUDIO_IMAGE@$STUDIO_DIGEST"; do
            crane tag "$target" latest
          done

  release-preflight:
    if: ${{ always() && vars.DEPLOYMENT_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || needs.promote-release.result == 'success') }}
    needs: [build-candidate, promote-release]
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.manifest.outputs.release_tag }}
      source_sha: ${{ steps.manifest.outputs.source_sha }}
      api_digest: ${{ steps.manifest.outputs.api_digest }}
      worker_digest: ${{ steps.manifest.outputs.worker_digest }}
      studio_digest: ${{ steps.manifest.outputs.studio_digest }}
      db_revision: ${{ steps.manifest.outputs.db_revision }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: imjasonh/setup-crane@v0.4
      - name: Install pinned release validator dependency
        run: python -m pip install --disable-pip-version-check pydantic==2.12.3
      - if: ${{ github.event_name == 'push' }}
        uses: actions/download-artifact@v4
        with: {name: "release-manifest-${{ needs.build-candidate.outputs.release_tag }}"}
      - if: ${{ github.event_name == 'workflow_dispatch' }}
        name: Verify selected release run provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RUN_ID: ${{ github.event.inputs.release_run_id }}
        run: |
          set -euo pipefail
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$RELEASE_RUN_ID")"
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .workflow_id <<<"$run")" = "$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/cd.yml" --jq .id)"
      - if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/download-artifact@v4
        with:
          pattern: release-manifest-*
          merge-multiple: true
          run-id: ${{ github.event.inputs.release_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate selected release before any migration
        id: manifest
        env:
          RUNNING_SCHEMA: ${{ vars.SCHEMA_CONTRACT_VERSION }}
          RUNNING_QUEUE: ${{ vars.QUEUE_CONTRACT_VERSION }}
        run: |
          set -euo pipefail
          tag="$(jq -r .release_tag release.json)"
          python scripts/release_manifest.py validate release.json "$tag" "$RUNNING_SCHEMA" "$RUNNING_QUEUE" "${{ github.repository }}" \
            "${{ vars.STAGING_API_URL }}" "${{ vars.STAGING_STUDIO_URL }}" "${{ vars.PRODUCTION_API_URL }}" "${{ vars.PRODUCTION_STUDIO_URL }}" \
            "${{ vars.STAGING_DEPLOY_TARGET }}" "${{ vars.PRODUCTION_DEPLOY_TARGET }}" \
            "${{ vars.STAGING_SMOKE_CREATE_URL }}" "${{ vars.STAGING_SMOKE_DOWNLOAD_BASE_URL }}" \
            "${{ vars.PRODUCTION_SMOKE_CREATE_URL }}" "${{ vars.PRODUCTION_SMOKE_DOWNLOAD_BASE_URL }}"
          for service in api worker studio; do
            repository="$(jq -r ".images.${service}.repository" release.json)"
            digest="$(jq -r ".images.${service}.digest" release.json)"
            test "$(crane digest "${repository}:${tag}")" = "$digest"
          done
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(jq -r .source_sha release.json)" >> "$GITHUB_OUTPUT"
          echo "api_digest=$(jq -r .images.api.digest release.json)" >> "$GITHUB_OUTPUT"
          echo "worker_digest=$(jq -r .images.worker.digest release.json)" >> "$GITHUB_OUTPUT"
          echo "studio_digest=$(jq -r .images.studio.digest release.json)" >> "$GITHUB_OUTPUT"
          echo "db_revision=$(jq -r .db_revision release.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: {name: "selected-release-${{ github.run_id }}", path: release.json, retention-days: 90}

  migrate-staging:
    if: ${{ vars.DEPLOYMENT_ENABLED == 'true' && (github.event_name == 'push' || github.event.inputs.release_action == 'deploy') }}
    needs: release-preflight
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Install pinned release validator dependency
        run: python -m pip install --disable-pip-version-check pydantic==2.12.3
      - uses: actions/download-artifact@v4
        with: {name: "selected-release-${{ github.run_id }}"}
      - name: Migrate with selected release image
        env: {DATABASE_URL: "${{ secrets.DATABASE_URL }}", API_DIGEST: "${{ needs.release-preflight.outputs.api_digest }}"}
        run: |
          set -euo pipefail
          docker run --rm -e DATABASE_URL "$API_IMAGE@$API_DIGEST" alembic upgrade head
          current="$(docker run --rm -e DATABASE_URL "$API_IMAGE@$API_DIGEST" alembic current)"
          heads="$(docker run --rm "$API_IMAGE@$API_DIGEST" alembic heads)"
          python scripts/release_manifest.py verify-db release.json "$current" "$heads"

  deploy-staging:
    if: ${{ always() && vars.DEPLOYMENT_ENABLED == 'true' && needs.release-preflight.result == 'success' && (needs.migrate-staging.result == 'success' || github.event.inputs.release_action == 'rollback') }}
    needs: [release-preflight, migrate-staging]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy selected digests through approved target
        env: {DEPLOY_TOKEN: "${{ secrets.DEPLOY_TOKEN }}"}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $DEPLOY_TOKEN" -H 'Content-Type: application/json' \
            -d '{"api":"${{ env.API_IMAGE }}@${{ needs.release-preflight.outputs.api_digest }}","worker":"${{ env.WORKER_IMAGE }}@${{ needs.release-preflight.outputs.worker_digest }}","studio":"${{ env.STUDIO_IMAGE }}@${{ needs.release-preflight.outputs.studio_digest }}","identity":{"source_sha":"${{ needs.release-preflight.outputs.source_sha }}","api_digest":"${{ needs.release-preflight.outputs.api_digest }}","worker_digest":"${{ needs.release-preflight.outputs.worker_digest }}","studio_digest":"${{ needs.release-preflight.outputs.studio_digest }}"}}' \
            "${{ vars.STAGING_DEPLOY_TARGET }}"

  verify-staging:
    if: ${{ vars.DEPLOYMENT_ENABLED == 'true' }}
    needs: [release-preflight, deploy-staging]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Install pinned release validator dependency
        run: python -m pip install --disable-pip-version-check pydantic==2.12.3
      - uses: actions/download-artifact@v4
        with: {name: "selected-release-${{ github.run_id }}"}
      - name: Verify identities, database, and authenticated create/download
        env:
          API_KEY: "${{ secrets.SMOKE_API_KEY }}"
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"
          RELEASE_ACTION: "${{ github.event.inputs.release_action }}"
          SCHEMA_COMPATIBLE_DB_REVISIONS: "${{ vars.SCHEMA_COMPATIBLE_DB_REVISIONS }}"
        run: |
          set -euo pipefail
          curl --fail --silent -H "X-API-Key: $API_KEY" "${{ vars.STAGING_API_URL }}/release/identity" > api.json
          curl --fail --silent -H "X-API-Key: $API_KEY" "${{ vars.STAGING_API_URL }}/release/worker-identity" > worker.json
          curl --fail --silent "${{ vars.STAGING_STUDIO_URL }}/release-identity.json" > studio.json
          jq -n --slurpfile api api.json --slurpfile worker worker.json --slurpfile studio studio.json \
            '{source_sha:$api[0].source_sha,api_digest:$api[0].digest,worker_digest:$worker[0].digest,studio_digest:$studio[0].digest}' > runtime.json
          python scripts/release_manifest.py verify-runtime release.json runtime.json
          current="$(docker run --rm -e DATABASE_URL "$API_IMAGE@${{ needs.release-preflight.outputs.api_digest }}" alembic current)"
          if [ "$RELEASE_ACTION" = rollback ]; then
            python scripts/release_manifest.py verify-db-compatible release.json "$current" "$SCHEMA_COMPATIBLE_DB_REVISIONS"
          else
            python scripts/release_manifest.py verify-db release.json "$current"
          fi
          curl --fail --silent -X POST -H "X-API-Key: $API_KEY" "${{ vars.STAGING_SMOKE_CREATE_URL }}" > create.json
          resource_id="$(jq -er .resource_id create.json)"
          curl --fail --silent -H "X-API-Key: $API_KEY" "${{ vars.STAGING_SMOKE_DOWNLOAD_BASE_URL }}/${resource_id}" -o download.bin
          test -s download.bin
      - uses: actions/upload-artifact@v4
        with: {name: "staging-release-evidence-${{ github.run_id }}", path: "*.json", retention-days: 90}

  migrate-production:
    if: ${{ vars.DEPLOYMENT_ENABLED == 'true' && (github.event_name == 'push' || github.event.inputs.release_action == 'deploy') }}
    needs: [release-preflight, verify-staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Install pinned release validator dependency
        run: python -m pip install --disable-pip-version-check pydantic==2.12.3
      - uses: actions/download-artifact@v4
        with: {name: "selected-release-${{ github.run_id }}"}
      - name: Migrate with selected release image
        env: {DATABASE_URL: "${{ secrets.DATABASE_URL }}", API_DIGEST: "${{ needs.release-preflight.outputs.api_digest }}"}
        run: |
          set -euo pipefail
          docker run --rm -e DATABASE_URL "$API_IMAGE@$API_DIGEST" alembic upgrade head
          current="$(docker run --rm -e DATABASE_URL "$API_IMAGE@$API_DIGEST" alembic current)"
          heads="$(docker run --rm "$API_IMAGE@$API_DIGEST" alembic heads)"
          python scripts/release_manifest.py verify-db release.json "$current" "$heads"

  deploy-production:
    if: ${{ always() && vars.DEPLOYMENT_ENABLED == 'true' && needs.release-preflight.result == 'success' && needs.verify-staging.result == 'success' && (needs.migrate-production.result == 'success' || github.event.inputs.release_action == 'rollback') }}
    needs: [release-preflight, verify-staging, migrate-production]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy selected digests through approved target
        env: {DEPLOY_TOKEN: "${{ secrets.DEPLOY_TOKEN }}"}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $DEPLOY_TOKEN" -H 'Content-Type: application/json' \
            -d '{"api":"${{ env.API_IMAGE }}@${{ needs.release-preflight.outputs.api_digest }}","worker":"${{ env.WORKER_IMAGE }}@${{ needs.release-preflight.outputs.worker_digest }}","studio":"${{ env.STUDIO_IMAGE }}@${{ needs.release-preflight.outputs.studio_digest }}","identity":{"source_sha":"${{ needs.release-preflight.outputs.source_sha }}","api_digest":"${{ needs.release-preflight.outputs.api_digest }}","worker_digest":"${{ needs.release-preflight.outputs.worker_digest }}","studio_digest":"${{ needs.release-preflight.outputs.studio_digest }}"}}' \
            "${{ vars.PRODUCTION_DEPLOY_TARGET }}"

  verify-production:
    if: ${{ vars.DEPLOYMENT_ENABLED == 'true' }}
    needs: [release-preflight, deploy-production]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Install pinned release validator dependency
        run: python -m pip install --disable-pip-version-check pydantic==2.12.3
      - uses: actions/download-artifact@v4
        with: {name: "selected-release-${{ github.run_id }}"}
      - name: Verify identities, database, and authenticated create/download
        env:
          API_KEY: "${{ secrets.SMOKE_API_KEY }}"
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"
          RELEASE_ACTION: "${{ github.event.inputs.release_action }}"
          SCHEMA_COMPATIBLE_DB_REVISIONS: "${{ vars.SCHEMA_COMPATIBLE_DB_REVISIONS }}"
        run: |
          set -euo pipefail
          curl --fail --silent -H "X-API-Key: $API_KEY" "${{ vars.PRODUCTION_API_URL }}/release/identity" > api.json
          curl --fail --silent -H "X-API-Key: $API_KEY" "${{ vars.PRODUCTION_API_URL }}/release/worker-identity" > worker.json
          curl --fail --silent "${{ vars.PRODUCTION_STUDIO_URL }}/release-identity.json" > studio.json
          jq -n --slurpfile api api.json --slurpfile worker worker.json --slurpfile studio studio.json \
            '{source_sha:$api[0].source_sha,api_digest:$api[0].digest,worker_digest:$worker[0].digest,studio_digest:$studio[0].digest}' > runtime.json
          python scripts/release_manifest.py verify-runtime release.json runtime.json
          current="$(docker run --rm -e DATABASE_URL "$API_IMAGE@${{ needs.release-preflight.outputs.api_digest }}" alembic current)"
          if [ "$RELEASE_ACTION" = rollback ]; then
            python scripts/release_manifest.py verify-db-compatible release.json "$current" "$SCHEMA_COMPATIBLE_DB_REVISIONS"
          else
            python scripts/release_manifest.py verify-db release.json "$current"
          fi
          curl --fail --silent -X POST -H "X-API-Key: $API_KEY" "${{ vars.PRODUCTION_SMOKE_CREATE_URL }}" > create.json
          resource_id="$(jq -er .resource_id create.json)"
          curl --fail --silent -H "X-API-Key: $API_KEY" "${{ vars.PRODUCTION_SMOKE_DOWNLOAD_BASE_URL }}/${resource_id}" -o download.bin
          test -s download.bin
      - uses: actions/upload-artifact@v4
        with: {name: "production-release-evidence-${{ github.run_id }}", path: "*.json", retention-days: 90}

  downgrade-production:
    if: ${{ vars.DEPLOYMENT_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.release_action == 'db_downgrade' && github.event.inputs.approve_db_downgrade == 'DOWNGRADE' }}
    needs: release-preflight
    runs-on: ubuntu-latest
    environment: production-db-downgrade
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Install pinned release validator dependency
        run: python -m pip install --disable-pip-version-check pydantic==2.12.3
      - uses: actions/download-artifact@v4
        with: {name: "selected-release-${{ github.run_id }}"}
      - name: Downgrade with the currently deployed image and verify the target revision
        env:
          API_KEY: "${{ secrets.SMOKE_API_KEY }}"
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"
          TARGET_REVISION: "${{ needs.release-preflight.outputs.db_revision }}"
        run: |
          set -euo pipefail
          curl --fail --silent -H "X-API-Key: $API_KEY" "${{ vars.PRODUCTION_API_URL }}/release/identity" > current-api.json
          CURRENT_API_DIGEST="$(jq -er .digest current-api.json)"
          docker run --rm -e DATABASE_URL "$API_IMAGE@$CURRENT_API_DIGEST" alembic downgrade "$TARGET_REVISION"
          current="$(docker run --rm -e DATABASE_URL "$API_IMAGE@$CURRENT_API_DIGEST" alembic current)"
          python scripts/release_manifest.py verify-db release.json "$current"
