name: Build & Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_image_tag:
        description: "Image tag to rollback to"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SERVICE_NAME: api
  IMAGE_REPOSITORY: ${{ github.repository }}
  HEALTHCHECK_URL: ${{ vars.PRODUCTION_URL }}

jobs:
  build-scan-push:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
          - service: studio-web
            dockerfile: apps/studio-web/Dockerfile
          - service: worker
            dockerfile: apps/worker-orchestrator/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: vars
        run: |
          echo "date_tag=$(date +%Y.%m.%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image (local only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runtime
          push: false
          load: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ steps.vars.outputs.date_tag }}
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:main-${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest

      - name: Trivy scan (${{ matrix.service }})
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Push image (after scan passes)
        if: success() && github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ steps.vars.outputs.date_tag }}
          docker push ghcr.io/${{ github.repository }}/${{ matrix.service }}:main-${{ steps.vars.outputs.sha_short }}
          docker push ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest

  deploy-production:
    needs: [build-scan-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, studio-web]
    env:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
      IMAGE_TAG: latest
    steps:
      - name: Deploy to production (${{ matrix.service }})
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_REPOSITORY}/${{ matrix.service }}:${IMAGE_TAG}"
          if [ -z "${DEPLOY_WEBHOOK_URL:-}" ]; then
            echo "DEPLOY_WEBHOOK_URL is not configured for production environment"
            exit 1
          fi
          curl -fsSL -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"image\":\"${IMAGE}\",\"service\":\"${{ matrix.service }}\",\"source\":\"cd-workflow\"}"

      - name: Verify deployment health
        if: matrix.service == 'api'
        run: |
          echo "Starting health check verification..."
          if [ -z "${HEALTHCHECK_URL:-}" ]; then
            echo "Warning: PRODUCTION_URL not configured, skipping health check"
            exit 0
          fi

          for i in 1 2 3 4 5; do
            echo "Health check attempt $i/5..."
            if curl -sf "${HEALTHCHECK_URL}/healthz" -o /dev/null 2>/dev/null; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

          echo "Health check failed after 5 attempts"
          exit 1

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_image_tag != ''
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, studio-web]
    env:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
      ROLLBACK_IMAGE_TAG: ${{ inputs.rollback_image_tag }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag rollback image as latest (${{ matrix.service }})
        run: |
          set -euo pipefail
          SOURCE_IMAGE="${REGISTRY}/${IMAGE_REPOSITORY}/${{ matrix.service }}:${ROLLBACK_IMAGE_TAG}"
          TARGET_IMAGE="${REGISTRY}/${IMAGE_REPOSITORY}/${{ matrix.service }}:latest"
          docker pull "$SOURCE_IMAGE"
          docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"
          docker push "$TARGET_IMAGE"

      - name: Trigger rollback deploy (${{ matrix.service }})
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_REPOSITORY}/${{ matrix.service }}:${ROLLBACK_IMAGE_TAG}"
          if [ -z "${DEPLOY_WEBHOOK_URL:-}" ]; then
            echo "DEPLOY_WEBHOOK_URL is not configured for production environment"
            exit 1
          fi
          curl -fsSL -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"image\":\"${IMAGE}\",\"service\":\"${{ matrix.service }}\",\"source\":\"rollback\"}"

      - name: Verify deployment health
        if: matrix.service == 'api'
        run: |
          echo "Starting health check verification..."
          if [ -z "${HEALTHCHECK_URL:-}" ]; then
            echo "Warning: PRODUCTION_URL not configured, skipping health check"
            exit 0
          fi

          for i in 1 2 3 4 5; do
            echo "Health check attempt $i/5..."
            if curl -sf "${HEALTHCHECK_URL}/healthz" -o /dev/null 2>/dev/null; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

          echo "Health check failed after 5 attempts"
          exit 1
