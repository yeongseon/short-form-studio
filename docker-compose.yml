services:
  postgres:
    image: postgres:16.6-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/artifacts:/app/data/artifacts
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker-orchestrator/Dockerfile
      target: runtime
    volumes:
      - ./data/artifacts:/app/data/artifacts
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  studio-web:
    build:
      context: .
      dockerfile: apps/studio-web/Dockerfile
      target: runtime
    ports:
      - "127.0.0.1:5174:8080"
    environment:
      API_KEY: ${API_KEY:-}
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.6.2
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    profiles:
      - gpu
    restart: unless-stopped

  stable-diffusion:
    image: shorts-automation-stable-diffusion:latest
    # Optional GPU profile service: requires a pre-built local image.
    # Dockerfile is expected at docker/stable-diffusion/Dockerfile once model code is available.
    # Example local build/tag: shorts-automation-stable-diffusion:1.0.0
    command: ["python", "launch.py", "--api", "--nowebui", "--listen", "--port", "7860", "--medvram", "--xformers", "--no-half", "--no-half-vae", "--skip-torch-cuda-test", "--skip-version-check", "--skip-python-version-check", "--skip-install"]
    ports:
      - "127.0.0.1:7860:7860"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:7860/sdapi/v1/sd-models')\" || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s
    profiles:
      - gpu
    restart: unless-stopped

  tts-qwen3:
    image: shorts-automation-tts-qwen3:latest
    # Optional GPU profile service: requires a pre-built local image.
    # Dockerfile is expected at docker/tts-qwen3/Dockerfile once model code is available.
    # Example local build/tag: shorts-automation-tts-qwen3:1.0.0
    ports:
      - "127.0.0.1:8100:8100"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    profiles:
      - gpu
    restart: unless-stopped

  stt-whisper:
    image: shorts-automation-stt-whisper:latest
    # Optional GPU profile service: requires a pre-built local image.
    # Dockerfile is expected at docker/stt-whisper/Dockerfile once model code is available.
    # Example local build/tag: shorts-automation-stt-whisper:1.0.0
    ports:
      - "127.0.0.1:9000:8200"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8200/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    profiles:
      - gpu
    restart: unless-stopped

  flower:
    image: mher/flower:2.0.1
    ports:
      - "127.0.0.1:5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - monitoring
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
