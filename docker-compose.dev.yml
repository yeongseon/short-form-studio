# Development overrides — use with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  api:
    build:
      target: dev
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/worker-orchestrator/tasks:/app/tasks
      - ./apps/worker-orchestrator/celery_app.py:/app/celery_app.py
      - ./packages/creator-service/creator_service:/usr/local/lib/python3.12/site-packages/creator_service
      - ./packages/creator-provider/creator_provider:/usr/local/lib/python3.12/site-packages/creator_provider
      - ./packages/creator-domain/creator_domain:/usr/local/lib/python3.12/site-packages/creator_domain

  worker:
    build:
      target: dev
    command: ["sh", "-c", "watchfiles --filter python 'celery -A celery_app.celery_app worker --loglevel=info --pool=solo' /app/tasks /app/celery_app.py"]
    volumes:
      - ./apps/worker-orchestrator/tasks:/app/tasks
      - ./apps/worker-orchestrator/celery_app.py:/app/celery_app.py
      - ./packages/creator-service/creator_service:/usr/local/lib/python3.12/site-packages/creator_service
      - ./packages/creator-provider/creator_provider:/usr/local/lib/python3.12/site-packages/creator_provider
      - ./packages/creator-domain/creator_domain:/usr/local/lib/python3.12/site-packages/creator_domain

  # Mount source for live beat schedule reload during development.
  beat:
    build:
      target: dev
    volumes:
      - ./apps/worker-orchestrator/tasks:/app/tasks
      - ./apps/worker-orchestrator/celery_app.py:/app/celery_app.py
      - ./packages/creator-service/creator_service:/usr/local/lib/python3.12/site-packages/creator_service
      - ./packages/creator-provider/creator_provider:/usr/local/lib/python3.12/site-packages/creator_provider
      - ./packages/creator-domain/creator_domain:/usr/local/lib/python3.12/site-packages/creator_domain

  # NOTE: This service is incompatible with docker-compose.local-server.yml.
  # The local-server override expects nginx on port 8080; this dev stage
  # runs Vite on 5173. Do not combine both overrides for studio-web.
  studio-web:
  # (see NOTE above)
    build:
      context: .
      dockerfile: apps/studio-web/Dockerfile
      target: dev
    ports: !override
      # Vite dev server on loopback. !override replaces the base prod mapping
      # (5174:8080 nginx) since the dev stage runs Vite on 5173, not nginx.
      - "127.0.0.1:5173:5173"
    environment:
      # Vite proxy forwards /api, /artifacts, /docs, etc. to the API service
      # on the compose network (resolvable as the 'api' service name).
      API_TARGET: "http://api:8000"
      # Vite must listen on all interfaces inside the container so Docker's
      # 127.0.0.1:5173 host binding can reach it. Host-side stays loopback-only.
      VITE_DEV_HOST: "0.0.0.0"
      # WARNING: Do NOT set VITE_API_KEY here. Any VITE_* var is baked into
      # the client bundle and becomes visible to all browser users.
    volumes:
      # Live source mounting enables hot-module replacement (HMR).
      - ./apps/studio-web:/app
      # Anonymous volume preserves the image-installed node_modules
      # (prevents the host directory from shadowing them).
      - /app/node_modules
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
