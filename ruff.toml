target-version = "py312"
line-length = 100

[lint]
# E/F are enforced repo-wide (real correctness rules). The I/UP/SIM categories
# and several flake8-bugbear checks have a large pre-existing backlog across the
# legacy codebase; they are relaxed here so CI is not blocked on historical
# files, and should be re-enabled incrementally as code is cleaned up. New code
# should still follow them. E402 is ignored because several modules import after
# a deliberate top-of-file guard/side-effect (already marked with noqa elsewhere).
select = ["E", "F"]
# F401/F811/F841 are relaxed: many "unused" imports are intentional re-export
# seams (tests import/monkeypatch them via a module), so auto-removing them
# breaks imports. F821 and other correctness checks in F stay enforced.
ignore = ["E501", "E402", "F401", "F811", "F841"]

# FastAPI dependency/parameter helpers are the framework's intended default-arg
# pattern; they are safe (no per-call mutable state) so B008 should allow them.
[lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
]

[format]
quote-style = "double"
