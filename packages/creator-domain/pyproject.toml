[project]
name = "creator-domain"
version = "0.1.0"
description = "Domain models for short-form pipeline"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Yeongseon Choe"}]
urls = {Homepage = "https://github.com/yeongseon/short-form-studio", Repository = "https://github.com/yeongseon/short-form-studio"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["pydantic>=2.0"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["creator_domain", "creator_domain.*"]
