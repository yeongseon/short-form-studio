[project]
name = "creator-service"
version = "0.1.0"
description = "Service layer for short-form pipeline"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Yeongseon Choe"}]
urls = {Homepage = "https://github.com/yeongseon/short-form-studio", Repository = "https://github.com/yeongseon/short-form-studio"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["creator-domain>=0.1.0", "pydantic>=2.0", "asyncpg>=0.29.0", "httpx>=0.27.0"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["creator_service", "creator_service.*"]

[tool.basedpyright]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownMemberType = false
extraPaths = ["../creator-domain"]
