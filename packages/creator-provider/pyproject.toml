[project]
name = "creator-provider"
version = "0.1.0"
description = "AI model provider abstractions for short-form pipeline"
requires-python = ">=3.10"
dependencies = ["redis", "httpx>=0.27.0"]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.30.0"]
google = ["google-generativeai>=0.7.0"]
stability = ["stability-sdk>=0.8.0"]
elevenlabs = ["elevenlabs>=1.0.0"]
all-external = ["openai>=1.0.0", "anthropic>=0.30.0", "google-generativeai>=0.7.0", "stability-sdk>=0.8.0", "elevenlabs>=1.0.0"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["creator_provider", "creator_provider.*"]
